<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 920" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0818" />
      <stop offset="50%" stop-color="#120A24" />
      <stop offset="100%" stop-color="#080512" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Pastel Branch Gradients -->
    <!-- 1. Teal Pastel -->
    <linearGradient id="pastelTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- 2. Purple Pastel -->
    <linearGradient id="pastelPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- 3. Amber Pastel -->
    <linearGradient id="pastelAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- 4. Emerald Pastel -->
    <linearGradient id="pastelEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BBF7D0" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <!-- 5. Sky Blue Pastel -->
    <linearGradient id="pastelSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- 6. Rose Pastel -->
    <linearGradient id="pastelRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBCFE8" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- 7. Indigo Pastel -->
    <linearGradient id="pastelIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1380" height="920" rx="28" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="280" cy="220" r="180" fill="#34D399" opacity="0.06" filter="url(#glow)" />
  <circle cx="1100" cy="220" r="180" fill="#4ADE80" opacity="0.06" filter="url(#glow)" />
  <circle cx="260" cy="700" r="180" fill="#FBBF24" opacity="0.05" filter="url(#glow)" />
  <circle cx="1100" cy="700" r="180" fill="#F472B6" opacity="0.06" filter="url(#glow)" />
  <circle cx="690" cy="460" r="220" fill="#8B5CF6" opacity="0.12" filter="url(#glow)" />

  <!-- Grid Guide Overlay -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="184" x2="1380" y2="184" />
    <line x1="0" y1="368" x2="1380" y2="368" />
    <line x1="0" y1="552" x2="1380" y2="552" />
    <line x1="0" y1="736" x2="1380" y2="736" />
    <line x1="276" y1="0" x2="276" y2="920" />
    <line x1="552" y1="0" x2="552" y2="920" />
    <line x1="828" y1="0" x2="828" y2="920" />
    <line x1="1104" y1="0" x2="1104" y2="920" />
