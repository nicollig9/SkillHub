    <!-- Center to Branch 6 (Bottom Right) -->
    <path d="M 800 510 C 920 560 1000 660 1100 720" stroke="url(#pastelRose)" stroke-dasharray="4,4" />
    <!-- Center to Branch 7 (Bottom Center) -->
    <path d="M 690 580 C 690 660 690 730 690 790" stroke="url(#pastelIndigo)" />
  </g>

  <!-- ========================================================================= -->
