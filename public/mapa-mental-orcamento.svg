  <!-- Brand / Header Badge -->
  <g transform="translate(690, 50)" text-anchor="middle">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#1C1132" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.45" />
    <text y="4" fill="#E9D5FF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.8">
      MAPA MENTAL OFICIAL • EDUCAÇÃO FINANCEIRA SKILLHUB
    </text>
  </g>

  <!-- Connecting Curved Branch Lines -->
  <g fill="none" stroke-width="2.5" opacity="0.45">
    <!-- Center to Branch 1 (Top Left) -->
    <path d="M 580 410 C 460 360 380 260 280 200" stroke="url(#pastelTeal)" stroke-dasharray="4,4" />
    <!-- Center to Branch 2 (Mid Left) -->
    <path d="M 550 460 C 430 460 370 460 280 460" stroke="url(#pastelPurple)" />
    <!-- Center to Branch 3 (Bottom Left) -->
